server {
  # En red host: escucha directamente en el :8085 del host (el nginx del host
  # ya proxya a 127.0.0.1:8085). Antes era :80 con mapeo de puertos de Docker.
  listen 8085;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing (React). Sin `$uri/`: existe un directorio real
  # /projects (las capturas), así que con `$uri/` nginx trataba /projects como
  # directorio, redirigía a /projects/ —con el puerto interno y sin HTTPS— y
  # devolvía 403. Ahora cae en index.html y la ruta la resuelve React Router.
  location / {
    try_files $uri /index.html;
  }

  # API -> backend en la red del host (ambos en network_mode: host -> loopback)
  location /api {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
